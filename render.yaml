databases:
  - name: pathway-db
    plan: free

services:
  # Django Web Service
  - type: web
    name: pathway-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pathway-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "False"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: CAPTCHA_SITE_KEY
        sync: false
      - key: CAPTCHA_SECRET_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: pathway-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: pathway-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: pathway-redis
          property: connectionString

  # Prometheus Service
  - type: web
    name: prometheus
    env: docker
    dockerContext: monitoring/prometheus
    dockerfilePath: monitoring/prometheus/Dockerfile
    plan: free

  # Alertmanager Service
  - type: web
    name: alertmanager
    env: docker
    dockerContext: monitoring/prometheus
    dockerfilePath: monitoring/prometheus/Dockerfile.alertmanager
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # Grafana Service
  - type: web
    name: grafana
    env: docker
    dockerContext: monitoring/grafana
    dockerfilePath: monitoring/grafana/Dockerfile
    plan: free
    envVars:
      - key: GF_SECURITY_ADMIN_PASSWORD
        value: "admin"
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - key: PROMETHEUS_HOST
        fromService:
          type: web
          name: prometheus
          property: host
      - key: PROMETHEUS_PORT
        value: "10000"

  # Redis Service
  - type: redis
    name: pathway-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

