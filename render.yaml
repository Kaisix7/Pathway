services:
  - type: web
    name: pathway-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: sh -c "python manage.py migrate && gunicorn backend.wsgi:application --bind 0.0.0.0:${PORT:-10000}"
    plan: free
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: pathway-common
      - key: DATABASE_URL
        fromDatabase:
          name: pathway-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pathway-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: pathway-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: pathway-redis
          property: connectionString

  - type: worker
    name: pathway-worker
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: celery -A backend worker --loglevel=info
    plan: starter
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: pathway-common
      - key: DATABASE_URL
        fromDatabase:
          name: pathway-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pathway-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: pathway-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: pathway-redis
          property: connectionString

  - type: keyvalue
    name: pathway-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: pathway-db
    databaseName: pathway
    user: pathway
    plan: free
    postgresMajorVersion: "17"

envVarGroups:
  - name: pathway-common
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "True"
      - key: JWT_EXP_SECONDS
        value: "3600"
