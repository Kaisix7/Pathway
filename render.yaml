databases:
  - name: pathway-db
    plan: free

services:
  # Django Web Service
  - type: web
    name: pathway-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pathway-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "False"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: CAPTCHA_SITE_KEY
        sync: false
      - key: CAPTCHA_SECRET_KEY
        sync: false

  # Prometheus Service
  - type: pserv
    name: prometheus
    env: docker
    dockerContext: monitoring/prometheus
    dockerfilePath: monitoring/prometheus/Dockerfile
    plan: free

  # Alertmanager Service
  - type: pserv
    name: alertmanager
    env: docker
    dockerContext: monitoring/prometheus
    dockerfilePath: monitoring/prometheus/Dockerfile.alertmanager
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # Grafana Service
  - type: web
    name: grafana
    env: docker
    dockerContext: monitoring/grafana
    dockerfilePath: monitoring/grafana/Dockerfile
    plan: free
    envVars:
      - key: GF_SECURITY_ADMIN_PASSWORD
        value: "admin"
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
