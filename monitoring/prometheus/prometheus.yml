global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:10000"
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:10000"]

  - job_name: "backend"
    metrics_path: "/metrics"
    scheme: https
    static_configs:
      - targets: ["pathway-backend-htas.onrender.com"]

  - job_name: "backend-local"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
