  <!-- GA4 Tracking -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XY317HK34J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XY317HK34J');

    // GA4 helper for Flutter to call via JS interop
    window.trackGA4Event = function(eventName, params) {
      gtag('event', eventName, params || {});
    };

    // PostHog Feature Flag helper for Flutter to call via JS interop
    window.isPostHogFeatureEnabled = function(flagName) {
      if (window.posthog) {
        return window.posthog.isFeatureEnabled(flagName);
      }
      return false;
    };

    // Extract UTMs and cache them in localStorage
    try {
      const urlParams = new URLSearchParams(window.location.search);
      ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'].forEach(param => {
        const val = urlParams.get(param);
        if (val) localStorage.setItem('cached_' + param, val);
      });
    } catch (e) {
      console.error('Error caching UTM parameters:', e);
    }

    // JS interop getter for Flutter
    window.getStoredUtmParameters = function() {
      try {
        const utms = {};
        ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'].forEach(param => {
          const val = localStorage.getItem('cached_' + param);
          if (val) utms[param] = val;
        });
        return JSON.stringify(utms);
      } catch (e) {
        console.error('Error reading UTM parameters from localStorage:', e);
        return '{}';
      }
    };
  </script>

  <!-- Google reCAPTCHA v2 -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script>
    window.captchaSiteKey = "{{ CAPTCHA_SITE_KEY }}";
    window.captchaToken = null;
    window.captchaResolver = null;

    window.showCaptchaOverlay = function(siteKey) {
      var key = siteKey || window.captchaSiteKey || '';
      if (!key || key.indexOf("CAPTCHA_SITE_KEY") !== -1 || key.trim() === "") {
        console.warn('reCAPTCHA site key is not configured, bypassing frontend captcha.');
        window.captchaToken = 'dev_bypass';
        return Promise.resolve('dev_bypass');
      }

      window.captchaToken = null;
      
      return new Promise(function(resolve, reject) {
        window.captchaResolver = resolve;
        
        var existing = document.getElementById('captcha-modal');
        if (existing) existing.remove();

        var modal = document.createElement('div');
        modal.id = 'captcha-modal';
        modal.style.position = 'fixed';
        modal.style.top = '0';
        modal.style.left = '0';
        modal.style.width = '100%';
        modal.style.height = '100%';
        modal.style.backgroundColor = 'rgba(0,0,0,0.5)';
        modal.style.display = 'flex';
        modal.style.justifyContent = 'center';
        modal.style.alignItems = 'center';
        modal.style.zIndex = '999999';

        var content = document.createElement('div');
        content.style.backgroundColor = 'white';
        content.style.padding = '24px';
        content.style.borderRadius = '12px';
        content.style.boxShadow = '0 8px 32px rgba(0,0,0,0.2)';
        content.style.display = 'flex';
        content.style.flexDirection = 'column';
        content.style.alignItems = 'center';
        content.style.gap = '20px';
        content.style.maxWidth = '90%';
        content.style.width = '350px';

        var title = document.createElement('h3');
        title.innerText = 'Security Verification';
        title.style.margin = '0';
        title.style.fontFamily = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
        title.style.color = '#1e293b';
        title.style.fontSize = '18px';
        title.style.fontWeight = '600';
        content.appendChild(title);

        var widgetDiv = document.createElement('div');
        widgetDiv.id = 'recaptcha-widget';
        content.appendChild(widgetDiv);

        var cancelBtn = document.createElement('button');
        cancelBtn.innerText = 'Cancel';
        cancelBtn.style.padding = '10px 20px';
        cancelBtn.style.border = '1px solid #cbd5e1';
        cancelBtn.style.backgroundColor = '#f8fafc';
        cancelBtn.style.color = '#475569';
        cancelBtn.style.borderRadius = '6px';
        cancelBtn.style.cursor = 'pointer';
        cancelBtn.style.fontSize = '14px';
        cancelBtn.style.fontWeight = '500';
        cancelBtn.style.width = '100%';
        cancelBtn.style.transition = 'background-color 0.2s';
        cancelBtn.onmouseover = function() { cancelBtn.style.backgroundColor = '#f1f5f9'; };
        cancelBtn.onmouseout = function() { cancelBtn.style.backgroundColor = '#f8fafc'; };
        cancelBtn.onclick = function() {
          modal.remove();
          window.captchaResolver(null);
        };
        content.appendChild(cancelBtn);

        modal.appendChild(content);
        document.body.appendChild(modal);

        try {
          if (typeof grecaptcha !== 'undefined') {
            grecaptcha.render('recaptcha-widget', {
              'sitekey': key,
              'callback': function(token) {
                window.captchaToken = token;
                setTimeout(function() {
                  modal.remove();
                  window.captchaResolver(token);
                }, 800);
              },
              'expired-callback': function() {
                window.captchaToken = null;
              },
              'error-callback': function() {
                window.captchaToken = null;
              }
            });
          } else {
            console.error('grecaptcha is not loaded');
            modal.remove();
            window.captchaResolver('dev_bypass');
          }
        } catch (e) {
          console.error('Error rendering reCAPTCHA widget:', e);
          modal.remove();
          window.captchaResolver('dev_bypass');
        }
      });
    };

    window.getCaptchaToken = function() {
      return window.captchaToken;
    };

    window.clearCaptchaToken = function() {
      window.captchaToken = null;
    };
  </script>
