name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pathway_test
          POSTGRES_USER: pathway
          POSTGRES_PASSWORD: pathway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pathway -d pathway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: 'False'
      POSTGRES_DB: pathway_test
      POSTGRES_USER: pathway
      POSTGRES_PASSWORD: pathway
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Run pytest with coverage
        run: pytest tests/ -v --cov=core --cov-fail-under=70

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, flutter, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy
        run: echo "Deploy is unblocked because tests, Flutter checks, and Docker build passed."

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: 'stable'
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter test
        run: flutter test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build backend
  - name: Migrate DB
  run: |
    cd backend
    python manage.py migrate

  - name: Run tests
  run: |
    cd backend
    pytest